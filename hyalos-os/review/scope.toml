# The independent review's scope over code hyalOS did not write (ADR-005 and ADR-008 of
# docs/plans/hyalos-kernel-core, design.md §2 "Review scope", repository ADR-0135).
#
# One row per component and part. `name` and `version` equal the locked ones in hyalos-os/Cargo.lock,
# kernel-image/Cargo.lock or guest/Cargo.lock; for TLSNotary, `version` is the tag and `commit` the
# locked revision. `part` is `use` (how hyalOS uses it) or `internals`. `position` is `covered` or
# `excluded`, and `reason` says why.
#
# `upstream_audit` is a citation of a published code audit, or `none found`, and says `searched
# <date>`. An `excluded` utility crate may say exactly `not searched (utility, <date>)` instead: no
# search was made, and none is needed for a crate the claim does not rest on. "None found" means no published audit report was found by a web search on that date;
# cargo-vet records were not consulted.
#
# `cargo xtask review-scope` holds this file to the lockfiles: a listed version that moves, a moved
# TLSNotary tag or commit, a direct dependency of a hyalOS crate with no row, or a second locked
# version of a listed crate with no row fails it, and so does a missing field, an unknown value, a
# `use` row ADR-005 or ADR-008 covers that is not `covered`, or a lockfile line it cannot read.
# Transitive crates the claim rests on have rows too: wasmparser (wasmi's parser) and the trust
# anchors, webpki-roots and rustls-webpki.

# --- The interpreter: the route to a taken-over kernel (ADR-005, repository ADR-0134) ---

[[component]]
name = "wasmi"
version = "2.0.3"
part = "use"
position = "covered"
upstream_audit = "SRLabs 2023 (0.31.0); Runtime Verification 2024 (0.36.0-0.38.0), https://runtimeverification.com/public-report/wasmi. Neither covers 2.0.3 (searched 2026-11-24)"
reason = "The configuration and host boundary we use: Config::default() with fuel in kernel-image/src/main.rs and audit/src/replay.rs, the fuel limits, and the imports of hyalos.abi/1. The features differ by backend: the monitor and the audit take wasmi's defaults, which include wat, so Module::new runs wat::parse_bytes on every guest in audit/src/replay.rs and a text guest is parsed there; the kernel image builds with stable, validate, memory64, portable-dispatch and libm, no wat and no simd, and refuses a text guest (the portable loop dispatch: with the tail-call dispatch the kernel build made no sibling calls, so long guest loops overflowed its stack, issue #503). Neither build enables simd. An interpreter bug is the route to a taken-over kernel. 2.0.3 is pinned for GHSA-qrr7-2g7f-r9rg, which named 2.0.0-beta.4 to 2.0.2 (ADR-0134)"

[[component]]
name = "wasmi"
version = "2.0.3"
part = "internals"
position = "covered"
upstream_audit = "SRLabs 2023 (0.31.0); Runtime Verification 2024 (0.36.0-0.38.0), https://runtimeverification.com/public-report/wasmi. Neither covers 2.0.3 (searched 2026-11-24)"
reason = "The changes since the last audited version, as far as the reviewer judges useful: no audit of 2.0.x was found. That includes the 2.0.2 to 2.0.3 diff, which fixes the store-lane offset decoding (simd only), regenerates the trap codes and Break from one macro, and adds upstream unsafe: wasmi::Error now holds its kind behind a NonNull, with unsafe impl Send and Sync and five unsafe blocks in src/error.rs (Box::from_raw, NonNull::new_unchecked, as_ref, as_mut). cargo xtask hyalos-unsafe checks only hyalOS's own code, so this row is where that unsafe is reviewed"

