# The independent review's scope over code hyalOS did not write (ADR-005 and ADR-008 of
# docs/plans/hyalos-kernel-core, design.md §2 "Review scope").
#
# One row per component and part. `name` and `version` equal the locked ones in hyalos-os/Cargo.lock,
# kernel-image/Cargo.lock or guest/Cargo.lock; for TLSNotary, `version` is the tag and `commit` the
# locked revision. `part` is `use` (how hyalOS uses it) or `internals`. `position` is `covered` or
# `excluded`. `upstream_audit` is a citation, `none found (searched <date>)`, or, for an excluded
# utility, `not searched (utility, <date>)`. Every direct dependency of a hyalOS crate has a row.
#
# DRAFT (Slice 11 is blocked): the `cargo xtask review-scope` check that holds this file to the
# lockfiles is not written yet. See docs/plans/hyalos-kernel-core/progress/slice-11.md.

# --- The interpreter: the route to a taken-over kernel (ADR-005) ---

[[component]]
name = "wasmi"
version = "2.0.2"
part = "use"
position = "covered"
upstream_audit = "SRLabs 2023 (0.31.0); Runtime Verification 2024 (0.36.0-0.38.0), https://runtimeverification.com/public-report/wasmi. Neither covers 2.0.2 (searched 2026-11-24)"
reason = "The configuration and host boundary we use (Config::default() in kernel-image and audit replay, the fuel limits, the imports of hyalos.abi/1). An interpreter bug is the route to a taken-over kernel. Version 2.0.2 is yanked and GHSA-qrr7-2g7f-r9rg names 2.0.0-beta.4 to 2.0.2; see the slice 11 progress file"

[[component]]
name = "wasmi"
version = "2.0.2"
part = "internals"
position = "covered"
upstream_audit = "SRLabs 2023 (0.31.0); Runtime Verification 2024 (0.36.0-0.38.0), https://runtimeverification.com/public-report/wasmi. Neither covers 2.0.2 (searched 2026-11-24)"
reason = "The changes since the last audited version, as far as the reviewer judges useful: no audit of this version was found"

[[component]]
name = "wasmi_core"
version = "2.0.2"
part = "internals"
position = "covered"
upstream_audit = "As wasmi: no audit of 2.0.2 found (searched 2026-11-24)"
reason = "Part of the interpreter, locked to wasmi's version; reviewed with wasmi's internals"

[[component]]
