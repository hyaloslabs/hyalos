[package]
name = "task-kernel"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
hyalos-audit = { path = "../audit" }
hyalos-profile = { path = "../profile" }
wasmi = "=2.0.2"
wat = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kvm-ioctls = "=0.25.1"
kvm-bindings = "=0.14.2"
libc = "0.2"
ureq = "2"
base64 = "0.22"

[features]
# The stand-in log and provider settings, for this program's tests.
test-trust = ["hyalos-audit/test-trust"]
