[package]
name = "hyalos-audit"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[features]
# The stand-in log and provider settings. A release build of `hyalos-verify` never enables this.
test-trust = []
# The Python guest spike's draft contract and its profiles (ADR-0136, ADR-001 and ADR-006 of
# docs/plans/hyalos-kernel-python). Off by default: a default build is unchanged.
spike-contract = ["hyalos-profile/spike-contract"]

[dependencies]
hyalos-profile = { path = "../profile" }
attest-check = { path = "../attest-check" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
wasmi = "=2.0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"

[dev-dependencies]
wat = "1"

[lints]
workspace = true
