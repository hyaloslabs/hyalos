[package]
name = "digest-guest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]

[workspace]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

# The lints of hyalOS's workspace (`../Cargo.toml`), repeated, since this is a workspace of its own.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[lints]
workspace = true
