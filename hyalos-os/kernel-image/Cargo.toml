[package]
name = "hyalos-kernel"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hyalos-profile = { path = "../profile" }
wasmi = { version = "=2.0.3", default-features = false, features = ["stable", "validate", "memory64", "auto-dispatch", "libm"] }

[features]
selftest = []
# The Python guest spike's `hyalos.spike/2` (Slice 4 of docs/plans/hyalos-kernel-python, ADR-0137):
# the image runs that profile, with `wasmi`'s deterministic float results (ADR-007 of that pack),
# and carries the profile's name after a marker the monitor reads. A default image has neither.
spike-profile-2 = ["hyalos-profile/spike-contract", "wasmi/deterministic"]

[profile.release]
opt-level = 3
panic = "abort"

[profile.dev]
panic = "abort"

# The lints of hyalOS's workspace (`../Cargo.toml`), repeated, since this is a workspace of its own.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[lints]
workspace = true
