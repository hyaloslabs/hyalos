[package]
name = "hyalos-kernel"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hyalos-profile = { path = "../profile" }
wasmi = { version = "=2.0.3", default-features = false, features = ["stable", "validate", "memory64", "auto-dispatch", "libm"] }

[features]
selftest = []

[profile.release]
opt-level = 3
panic = "abort"

[profile.dev]
panic = "abort"

# The lints of hyalOS's workspace (`../Cargo.toml`), repeated, since this is a workspace of its own.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[lints]
workspace = true
