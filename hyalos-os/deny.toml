# Dependency policy for the hyalOS workspace (ADR-0130). Checked by CI's `hyalos-os` job.
# It starts from the main workspace's policy and differs by naming the TLSNotary git source.
# The trusted core has a size budget, and every third-party crate is code we run but do not count,
# so what we allow in is deliberate: known licenses, a known registry, and no known vulnerabilities.

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory, including unmaintained crates. An exception needs an entry here with a reason.
ignore = [
    # Held at 0.5.5 by elliptic-curve 0.13 under k256 and p256, which tlsn-attestation uses. No compatible
    # fix exists. Whether it reaches the notary's signing is assessed in #451, before any verifier release.
    { id = "RUSTSEC-2026-0387", reason = "no compatible fix for crypto-bigint 0.5.5; assessment tracked in #451" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained with no patched version; attest uses it directly" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained with no patched version; held by tlsn-tls-core" },
]

[licenses]
# Only the licenses in use today. A dependency under another license fails CI, and allowing it is a reviewed change here.
allow = [
    "MIT",
    "Apache-2.0",
    # ed25519-dalek, curve25519-dalek and subtle, for event signatures (ADR-0018).
    "BSD-3-Clause",
    # foldhash, via rusqlite's statement cache.
    "Zlib",
    # unicode-ident, a build-time dependency of the proc-macro crates under curve25519-dalek.
    "Unicode-3.0",
    # ar_archive_writer, a build dependency of psm under stacker under cedar-policy-core (ADR-0008).
    # The exception only relaxes the license for use as part of LLVM-derived code; it is Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    # ring (Apache-2.0 AND ISC), rustls-webpki and untrusted, for the broker's TLS (ADR-0039).
    "ISC",
    # webpki-roots, the Mozilla root certificates the broker trusts (ADR-0039). The data is
    # permissively licensed; it asks for nothing beyond keeping the notice.
    "CDLA-Permissive-2.0",
    # arrayref, under blake3 under TLSNotary's mpz crates.
    "BSD-2-Clause",
    # tiny-keccak, under TLSNotary.
    "CC0-1.0",
]
confidence-threshold = 0.93

# Our own crates are MIT (ADR-0115) and unpublished, so the audit does not check them.
[licenses.private]
ignore = true

# These TLSNotary crates declare no licence in their manifests. Their repositories' READMEs license all
# their crates under MIT or Apache-2.0, at the pinned revisions in Cargo.lock.
