[bans]
# Two versions of one crate is a warning for now: it costs build time and review attention.
multiple-versions = "warn"
wildcards = "deny"
# Workspace members depend on each other by path, which has no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# TLSNotary, pinned by tag in attest/Cargo.toml, and the three repositories it pins by revision.
allow-git = [
    "https://github.com/tlsnotary/tlsn",
    "https://github.com/tlsnotary/mpz2",
    "https://github.com/tlsnotary/tlsn-utils",
    "https://github.com/tlsnotary/rs-merkle.git",
]
