# Dependency policy for the hyalOS workspace (ADR-0130). Checked by CI's `hyalos-os` job.
# It starts from the main workspace's policy. It differs by allowing TLSNotary's git repositories, the
# licenses this dependency tree needs, stated licenses for TLSNotary crates that declare none, and three
# advisories with no compatible fix. What we allow in is deliberate: known licenses, known sources, and
# no known vulnerability without a recorded reason.

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory, including unmaintained crates. An exception needs an entry here with a reason.
ignore = [
    # Held at 0.5.5 by elliptic-curve 0.13 under k256 and p256, which tlsn-attestation uses. No compatible
    # fix exists. Whether it reaches the notary's signing is assessed in #451, before any verifier release.
    { id = "RUSTSEC-2026-0387", reason = "no compatible fix for crypto-bigint 0.5.5; assessment tracked in #451" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained with no patched version; attest uses it directly" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained with no patched version; held by tlsn-tls-core" },
]

[licenses]
# Only the licenses in use today. A dependency under another license fails CI, and allowing it is a reviewed change here.
allow = [
    "MIT",
    "Apache-2.0",
    # curve25519-dalek and subtle under TLSNotary, and vmm-sys-util under the monitor's KVM crates.
    "BSD-3-Clause",
    # foldhash, miniz_oxide and zlib-rs.
    "Zlib",
    # unicode-ident and the icu crates, under the proc-macro and URL crates.
    "Unicode-3.0",
    # The wasm tooling behind `wat`, and blake3. The exception only relaxes the license for use as part of
    # LLVM-derived code; it is Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    # ring (Apache-2.0 AND ISC), rustls-webpki and untrusted, for the notary link and the public log's TLS.
    "ISC",
    # webpki-roots and webpki-root-certs, the Mozilla root certificates. The data is permissively
    # licensed; it asks for nothing beyond keeping the notice.
    "CDLA-Permissive-2.0",
    # arrayref, under blake3 under TLSNotary's mpz crates, and zerocopy.
    "BSD-2-Clause",
    # tiny-keccak, blake3 and constant_time_eq, under TLSNotary.
    "CC0-1.0",
]
confidence-threshold = 0.93

# Our own crates are MIT (ADR-0115) and unpublished, so the audit does not check them.
[licenses.private]
ignore = true

# These TLSNotary crates declare no licence in their manifests. Their repositories' READMEs license all
# their crates under MIT or Apache-2.0, at the pinned revisions in Cargo.lock.
