[package]
name = "attest"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-beta.1", features = ["mozilla-certs"] }
anyhow = "1"
bincode = "1.3"
futures = "0.3"
hex = "0.4"
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
# The link between the two programs, and the stand-in provider: TLS and self-signed certificates.
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# The stand-in has no tests of its own: the integration tests run it.
[[bin]]
name = "standin"
path = "src/bin/standin.rs"
test = false

# The notary has no unit tests either: the integration tests run it as a program.
[[bin]]
name = "notary"
path = "src/bin/notary.rs"
test = false

# Signs bad tickets for the audit's tests. Off by default, and `notary` does not compile with it on.
[features]
forge-ticket = []
# Lets a test fail the rename of a staged canary result. A default build ignores the setting.
canary-test-hooks = []

[[bin]]
name = "forging-notary"
path = "src/bin/forging-notary.rs"
required-features = ["forge-ticket"]
test = false

[lints]
workspace = true
