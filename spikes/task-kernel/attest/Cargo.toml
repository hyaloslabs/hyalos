[package]
name = "attest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-beta.1", features = ["mozilla-certs"] }
anyhow = "1"
bincode = "1.3"
futures = "0.3"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
# The stand-in provider only: a local TLS server and a test root for it.
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# The stand-in has no tests of its own: the integration tests run it.
[[bin]]
name = "standin"
path = "src/bin/standin.rs"
test = false

[profile.release]
opt-level = 3
