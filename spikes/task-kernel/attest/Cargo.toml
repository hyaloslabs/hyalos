[package]
name = "attest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-beta.1", features = ["mozilla-certs"] }
anyhow = "1"
bincode = "1.3"
futures = "0.3"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }

[profile.release]
opt-level = 3
