[workspace]
resolver = "3"
members = ["core/*", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# The strict set applies to the trusted core (ADR-0017). crates/xtask does not inherit it.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
