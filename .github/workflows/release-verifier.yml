name: release-verifier

# A release of `hyalos-verify` (ADR-0131). On a tag `verifier-vX.Y.Z` that is on main, matches the
# verifier's version and whose commit has green `hyalos-os` evidence from ci's run on main, it builds
# the static binary reproducibly, attests its provenance and publishes it with its SHA-256. A human
# pushes the tag: nothing here creates one (ADR-0111).
#
# Started by hand on main, it runs the evidence, the build and the provenance, and creates no release.
# Only the operator starts it.
on:
  push:
    tags: ["verifier-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verifier-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  evidence:
    name: verifier evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main and is the verifier's version, or the manual run is on main
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' hyalos-os/verify/Cargo.toml | head -n1)
            test -n "$version" || { echo "no verifier version"; exit 1; }
            test "$TAG" = "verifier-v$version" || { echo "tag $TAG is not verifier-v$version"; exit 1; }
          elif [ "$EVENT" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "a manual run is on main only"; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      - name: The commit has green hyalos-os results
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-evidence.sh "$GITHUB_SHA" hyalos-os

  build:
    name: verifier binary
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the static binary
        run: .github/scripts/build-verifier.sh dist
      - name: The binary names this commit
        run: dist/hyalos-verify-x86_64-linux --version | grep -qxF "commit $GITHUB_SHA"
      # With no `if`: a release without provenance is not published (ADR-0131).
      - name: Attest the binary's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hyalos-verify-x86_64-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyalos-verify
          path: |
            dist/hyalos-verify-x86_64-linux
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish the verifier
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hyalos-verify
          path: dist
      - name: Publish the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          printf 'Confirm this copy before you use it: docs/adr/0131-a-verifier-release-is-confirmed-two-ways.md.\n' > notes.md
          gh release create "$TAG" dist/hyalos-verify-x86_64-linux dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
