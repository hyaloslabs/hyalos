name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Third-party actions are pinned to a commit, not a tag, because a tag can move.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request changes only documentation (#243): files under docs/ or spikes/, or Markdown at
  # the repository root. If it does, the jobs below are skipped, and a skipped job still reports its
  # required check. They run unless this says "true", so if this job fails, they still run. A push to main
  # always runs everything. It also says which of the specialised jobs a pull request needs (ADR-0124).
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      proofs: ${{ steps.classify.outputs.proofs }}
      sigstore: ${{ steps.classify.outputs.sigstore }}
      sigstore_library: ${{ steps.classify.outputs.sigstore_library }}
      mcp: ${{ steps.classify.outputs.mcp }}
      hyalos_os: ${{ steps.classify.outputs.hyalos_os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      # The checkout is GitHub's merge of the pull request into its base, so its first parent is the base.
      # Without rename detection, a file moved into docs/ also lists the path it left. A skill's Markdown
      # counts as documentation (#251); any other file under skills/ does not, nor does .claude/.
      - name: Classify the changed files
        id: classify
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          others="$(grep -vE '^(docs/|spikes/|skills/.+\.md$|[^/]+\.md$)' <<<"$changed" || true)"
          printf 'Changed:\n%s\nNot documentation:\n%s\n' "$changed" "$others"
          if [ -n "$changed" ] && [ -z "$others" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed: lint runs; the build, audit, conformance and proof jobs are skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          # The specialised jobs run on a pull request only when something they build changed (ADR-0124):
          # each pattern is the job's dependency closure, plus what every build reads. A push to main
          # sets none of these, and an output that is not "false" runs the job.
          every='^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|\.cargo/|\.github/workflows/ci\.yml)'
          touches() { grep -qE "$every|$1" <<<"$changed" && echo true || echo false; }
          {
            echo "proofs=$(touches '^(core/policy/|core/types/|crates/policy-proof/)')"
            echo "sigstore=$(touches '^(core/plugin/|core/types/|crates/sigstore-testkit/)')"
            echo "sigstore_library=$(touches '^Cargo\.lock$')"
            echo "mcp=$(touches '^(core/|crates/mcp-conformance/)')"
            # hyalOS is its own workspace (ADR-0130), so the main workspace's manifests do not reach it.
            echo "hyalos_os=$(grep -qE '^(hyalos-os/|rust-toolchain\.toml$|\.github/workflows/ci\.yml$|\.github/scripts/(build-verifier|check-verifier-rebuild)\.sh$)' <<<"$changed" && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  # The time budget (#320). Every job has a 20-minute limit and should finish in 15. The test run is
  # split in two, each on its own runner, because the whole workspace took 18 to 20 minutes in one job.
  # When a job's run nears 15 minutes, move packages between the parts of `test`, or add a part, rather
  # than raising the limit. A new part needs nothing else: `build, lint, test` gathers every part.

  # Formatting, lints and the layout checks: everything that needs no test to run.
  # It runs on every pull request, documentation only included, since `cargo xtask docs` checks the
  # security pages' references to code (ADR-0119).
  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The exact toolchain is pinned in rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Dependencies' builds, restored on every run and saved only from main, so a pull request cannot
      # write what main restores (ADR-0124).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Crate layout (ADR-0017)
        run: cargo xtask layout
      # `lines` also counts hyalOS's own code against its separate budget (ADR-0133).
      - name: Trusted-core and hyalOS size (ADR-0017, ADR-0133)
        run: cargo xtask lines
      - name: hyalOS uses unsafe only where listed and explained (ADR-0133)
        run: cargo xtask hyalos-unsafe
      - name: Security pages cite code that exists (#333)
        run: cargo xtask docs

  # The workspace's tests in two parts that together are the whole workspace: the `hyalos` crate, and
  # every other package (`--exclude`, so a new package lands in the second part without an edit here).
  test:
    name: test (${{ matrix.part.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: the hyalos crate
            packages: -p hyalos
          - name: the rest of the workspace
            packages: --workspace --exclude hyalos
    # Line tables only: full debug info for every test binary, with Wasmtime's in the build (ADR-0087),
    # fills the runner's disk, and the linker dies with a bus error. Backtraces still name lines.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Dependencies' builds, restored on every run and saved only from main, so a pull request cannot
      # write what main restores (ADR-0124).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.part.name }}
      # The container driver's contract runs against Docker here (ADR-0032), and a missing runtime fails.
      - name: Pull the substrate contract's image
        run: docker pull ubuntu:24.04
      # The gVisor driver's contract runs here too (ADR-0056), and gVisor that cannot run fails.
      - name: Install gVisor
        run: .github/scripts/install-gvisor.sh
      # The microVM driver's contract runs here too (ADR-0058), in Firecracker on the runner's KVM.
      - name: Install Firecracker, the guest kernel and the init
        run: .github/scripts/install-firecracker.sh "$RUNNER_TEMP/microvm"
      # The git proxy's test runs the real git client and git http-backend (ADR-0046); missing git fails.
      # The broker's confinement test needs the runner's kernel to have Landlock (ADR-0118).
      - name: Test
        run: cargo test ${{ matrix.part.packages }} --locked
        env:
          HYALOS_REQUIRE_CONTAINER: "1"
          HYALOS_REQUIRE_GVISOR: "1"
          HYALOS_REQUIRE_MICROVM: "1"
          HYALOS_REQUIRE_GIT: "1"
          HYALOS_REQUIRE_LANDLOCK: "1"
      - name: Disk left
        if: ${{ always() }}
        run: df -h / "$GITHUB_WORKSPACE"; du -sh target 2>/dev/null || true

  # The required check (ADR-0105, ADR-0108, ADR-0119). It passes only when lint passed, and every part
  # of the tests, the simulation sweep and the job spec's model check passed, or only documentation
  # changed and they were all skipped. Anything else, a
  # failure, a cancellation or a job that never ran, fails it, so splitting a job never makes it optional.
  rust:
    name: build, lint, test
    needs: [changes, lint, test, simulation, spec, hyalos-os]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gathered job passed
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          LINT: ${{ needs.lint.result }}
          RESULTS: ${{ needs.test.result }} ${{ needs.simulation.result }} ${{ needs.spec.result }}
          HYALOS_OS: ${{ needs.hyalos-os.result }}
          HYALOS_OS_CHANGED: ${{ needs.changes.outputs.hyalos_os }}
        run: |
          echo "docs only: ${DOCS_ONLY:-unknown}; lint: ${LINT}; test, simulation, spec: ${RESULTS}"
          # Lint runs on every change, documentation only included (ADR-0119).
          if [ "${LINT}" != "success" ]; then
            echo "::error::lint ended '${LINT}', not 'success'"
            exit 1
          fi
          want=success
          if [ "${DOCS_ONLY}" = "true" ]; then want=skipped; fi
          for r in ${RESULTS}; do
            if [ "$r" != "$want" ]; then
              echo "::error::a gathered job ended '$r', not '$want'"
              exit 1
            fi
          done
          # hyalOS may be skipped only when the change was classified as not touching it (ADR-0130).
          echo "hyalos-os: ${HYALOS_OS}; changed: ${HYALOS_OS_CHANGED:-unknown}"
          if [ "${HYALOS_OS}" != "success" ] && { [ "${HYALOS_OS}" != "skipped" ] || [ "${HYALOS_OS_CHANGED}" != "false" ]; }; then
            echo "::error::hyalos-os ended '${HYALOS_OS}' with its change output '${HYALOS_OS_CHANGED:-unset}'"
            exit 1
          fi

  deny:
    name: dependency audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # hyalOS's own workspace (ADR-0130). The monitor's tests run the attest programs, so those build first.
  hyalos-os:
    name: hyalos-os
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.hyalos_os != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: hyalos-os
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the attest programs
        run: |
          cargo build --release --locked --manifest-path hyalos-os/Cargo.toml -p attest --bins
          cargo build --release --locked --manifest-path hyalos-os/Cargo.toml -p attest --features forge-ticket --bin forging-notary
      # The two backends are compared on the runner's KVM, so the kernel image's target is needed.
      # The guest's target is for its lint below.
      - name: Open KVM and add the kernel image's and the guest's targets
        run: |
          rustup target add x86_64-unknown-none wasm32-unknown-unknown
          if ! [ -r /dev/kvm ] || ! [ -w /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      # Every hyalOS crate holds to rustfmt and clippy (S-05.3 of docs/plans/hyalos-kernel-core),
      # before the long tests, so a lint fails fast. The test switches and the self-test kernel
      # compile other code, so clippy runs with and without them. `forging-notary` needs a feature
      # `notary` cannot compile with. The kernel image and the guest are workspaces of their own.
      - name: Format and lint every crate
        run: |
          cargo fmt --manifest-path hyalos-os/Cargo.toml --all --check
          (cd hyalos-os/kernel-image && cargo fmt --check)
          (cd hyalos-os/guest && cargo fmt --check)
          cargo clippy --locked --manifest-path hyalos-os/Cargo.toml --workspace --all-targets --features task-kernel/test-trust,hyalos-audit/test-trust,task-kernel/test-switches -- -D warnings
          cargo clippy --locked --manifest-path hyalos-os/Cargo.toml --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path hyalos-os/Cargo.toml -p attest --features forge-ticket --bin forging-notary -- -D warnings
          (cd hyalos-os/kernel-image && cargo clippy --release --locked -- -D warnings && cargo clippy --release --locked --features selftest -- -D warnings)
          (cd hyalos-os/guest && cargo clippy --release --locked --target wasm32-unknown-unknown -- -D warnings)
      # The test-only switches (the hostile machine runner and the injected confinement failures)
      # run here, and the runner's confinement must hold on this kernel (ADR-0132). The channel's
      # frame fuzzer, 100,000 frames from a fixed seed, is one of these tests
      # (`core_s_05_5_frame_fuzzer`, S-05.5).
      - name: Test the workspace
        run: cargo test --release --locked --manifest-path hyalos-os/Cargo.toml --workspace --features task-kernel/test-trust,hyalos-audit/test-trust,task-kernel/test-switches
        env:
          HYALOS_REQUIRE_KVM: "1"
          HYALOS_REQUIRE_LANDLOCK: "1"
      # The default build, without the test switches: no test-only variable or raw kernel image
      # changes what it does (S-05.4 of docs/plans/hyalos-kernel-core).
      - name: Test the release build's switches
        run: cargo test --release --locked --manifest-path hyalos-os/Cargo.toml -p task-kernel --test release_switches
        env:
          HYALOS_REQUIRE_KVM: "1"
          HYALOS_REQUIRE_LANDLOCK: "1"
      # The request handler on 100,000 hostile requests from its fixed seed (S-05.5), in the release
      # build the step above made. A panic or crash ends it with a failing status.
      - name: Fuzz the request handler
        run: cargo run --release --locked --manifest-path hyalos-os/Cargo.toml -p task-kernel -- fuzz hyalos-os/evidence/fixtures/issues.tsv 100000
      # What the runner's KVM leaves a taken-over kernel (S-03.3 of docs/plans/hyalos-kernel-core). A
      # reachable instruction is a stated limit (exit 1); a probe that could not test (exit 2) fails.
      - name: Probe what the runner's KVM exposes
        run: |
          status=0
          cargo run --release --locked --manifest-path hyalos-os/Cargo.toml -p task-kernel -- probe-host || status=$?
          [ "$status" -le 1 ]
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: hyalos-os/Cargo.toml
          command: check
          arguments: --all-features --config hyalos-os/deny.toml
      # The published verifier must be rebuildable from its source in any directory (ADR-0131).
      - name: Build the verifier twice and compare
        run: .github/scripts/check-verifier-rebuild.sh

  # Ten thousand simulated jobs, each under the fault schedule its seed draws (ADR-0013, ADR-0104). The
  # seeds are fixed, so a failure is the change's and not luck, and the log names the one command that
  # replays each failing seed. Release mode: a run is several times faster there than in debug.
  simulation:
    name: simulation
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Dependencies' builds, restored on every run and saved only from main, so a pull request cannot
      # write what main restores (ADR-0124).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Sweep 10,000 fault schedules
        run: cargo run --release --locked -p hyalos-world --bin sim -- --sweep 0 10000 | tee -a "${GITHUB_STEP_SUMMARY}"
        # Named, so the step runs with pipefail and the sweep's exit status survives the tee.
        shell: bash

  # The job state machine's TLA+ spec (ADR-0013, ADR-0108): TLC checks every invariant of spec/Job.tla,
  # then that each mutant breaks the one invariant it is for. The tools are a pinned release checked
  # against its checksum, run on the runner's Java. They are never part of the binary.
  spec:
    name: job spec
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TLA_VERSION: "1.7.4"
      TLA_SHA256: "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the TLA+ tools
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/tla2tools.jar" "https://github.com/tlaplus/tlaplus/releases/download/v${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  ${RUNNER_TEMP}/tla2tools.jar" | sha256sum --check --strict
          java -version
      - name: Model-check the spec and its mutants
        run: |
          .github/scripts/check-spec.sh "${RUNNER_TEMP}/tla2tools.jar" | tee "${RUNNER_TEMP}/spec.out"
          grep -E '^== |broken|No error|states generated,|::error' "${RUNNER_TEMP}/spec.out" >> "${GITHUB_STEP_SUMMARY}" || true
        # Named, so the step runs with pipefail and the check's exit status survives the tee.
        shell: bash

  # The official MCP conformance suite against the engine's MCP protocol layer (ADR-0067). The suite
  # is pinned with its lockfile and installed without install scripts; it runs on the runner's Node.
  mcp-conformance:
    name: mcp conformance
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.mcp != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Dependencies' builds, restored on every run and saved only from main, so a pull request cannot
      # write what main restores (ADR-0124).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned conformance suite
        run: npm ci --ignore-scripts --prefix crates/mcp-conformance
      - name: Run every scenario 2026-07-28 requires
        run: cargo test -p hyalos-mcp-conformance --locked
        env:
          HYALOS_REQUIRE_MCP_CONFORMANCE: "1"

  # The baseline's proofs (ADR-0008, ADR-0033). The solver runs here and nowhere else: it is never part
  # of the binary. cvc5 is the release cedar-policy-symcc documents, checked against a pinned checksum.
  policy-proofs:
    name: policy proofs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.proofs != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CVC5_VERSION: "1.3.1"
      CVC5_SHA256: "1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Dependencies' builds, restored on every run and saved only from main, so a pull request cannot
      # write what main restores (ADR-0124).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cvc5
        run: |
          curl -fsSL -o cvc5.zip "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-static.zip"
          echo "${CVC5_SHA256}  cvc5.zip" | sha256sum --check --strict
          unzip -q cvc5.zip -d "${RUNNER_TEMP}/cvc5"
          CVC5_BIN="$(find "${RUNNER_TEMP}/cvc5" -name cvc5 -type f | head -n 1)"
          chmod +x "${CVC5_BIN}"
          "${CVC5_BIN}" --version | head -n 1
          echo "CVC5=${CVC5_BIN}" >> "${GITHUB_ENV}"
      - name: Prove the baseline
        run: cargo test -p hyalos-policy-proof --locked
        env:
          HYALOS_REQUIRE_CVC5: "1"
      # On a pull request, say whether the baseline now allows more or less than on the base branch.
      - name: Compare the baseline with the base branch
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:core/policy/policies/baseline.cedar" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:core/policy/policies/baseline.cedar" > "${RUNNER_TEMP}/old-baseline.cedar"
            cargo run -q --locked -p hyalos-policy-proof -- "${RUNNER_TEMP}/old-baseline.cedar" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "The base branch has no baseline yet; nothing to compare with." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  # The Sigstore library an install verifies with (S7.12, ADR-0093), at the version Cargo.lock locks:
  # its own tests and Sigstore's conformance suite, at the commit that version's tag names. Changing the
  # library means changing these two lines, so both run again, as the vectors do in the build above.
  sigstore-library:
    name: sigstore library conformance
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.sigstore_library != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SIGSTORE_VERSION: "0.15.1"
      # sigstore-rust's tag sigstore-verify-v0.15.1.
      SIGSTORE_COMMIT: fc308a2f0bcef92f10c199c6d75fa72441b329f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version tested here is the one the binary locks
        run: |
          locked="$(grep -A1 '^name = "sigstore-verify"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          echo "Cargo.lock: sigstore-verify ${locked}; this job: ${SIGSTORE_VERSION}"
          test "${locked}" = "${SIGSTORE_VERSION}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sigstore/sigstore-rust
          ref: ${{ env.SIGSTORE_COMMIT }}
          path: sigstore-rust
          persist-credentials: false
      - name: Install its pinned toolchain
        working-directory: sigstore-rust
        run: rustup toolchain install
      # Dependencies' builds, restored on every run and saved only from main, so a pull request cannot
      # write what main restores (ADR-0124).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: sigstore-rust
      - name: The library's own tests
        working-directory: sigstore-rust
        run: cargo test --locked -p sigstore-verify
      - name: Build the conformance client
        working-directory: sigstore-rust
        run: cargo build --release --locked -p sigstore-conformance
      # Verification only: signing would need an identity token and write to the public log.
      - uses: sigstore/sigstore-conformance@21533cde107c734ebc153c3e3a24d75fc9811a36 # v0.0.29
        with:
          entrypoint: ${{ github.workspace }}/sigstore-rust/target/release/conformance
          skip-signing: "true"
          skip-result-upload: "true"

  # The same Sigstore vectors on every platform Hyalos supports (ADR-0093): the static musl target the
  # release builds, and aarch64 Linux, cross-compiled and run under QEMU since there is no arm64 runner.
  # x86_64 glibc runs them in the build job.
  sigstore-platforms:
    name: sigstore vectors (musl, aarch64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.sigstore != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and the targets
        run: |
          rustup toolchain install
          rustup target add aarch64-unknown-linux-gnu
      # Dependencies' builds, restored on every run and saved only from main, so a pull request cannot
      # write what main restores (ADR-0124).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install musl, the aarch64 cross compiler and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: musl
        run: cargo test --locked -p hyalos-plugin --test sigstore --target x86_64-unknown-linux-musl
      - name: aarch64
        run: cargo test --locked -p hyalos-plugin --test sigstore --target aarch64-unknown-linux-gnu
