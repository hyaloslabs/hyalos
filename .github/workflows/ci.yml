name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Third-party actions are pinned to a commit, not a tag, because a tag can move.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The exact toolchain is pinned in rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The container driver's contract runs against Docker here (ADR-0032), and a missing runtime fails.
      - name: Pull the substrate contract's image
        run: docker pull ubuntu:24.04
      - name: Test
        run: cargo test --workspace --locked
        env:
          HYALOS_REQUIRE_CONTAINER: "1"
      - name: Crate layout (ADR-0017)
        run: cargo xtask layout
      - name: Trusted-core size (ADR-0017)
        run: cargo xtask lines

  deny:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
