name: sandbox image

# Builds the sandbox image and runs each harness in it under a DNS log and a record of the broker
# channel (S2.9, ADR-0040). It runs when anything that goes into the image, or that the test drives,
# changes: a pinned harness or SDK version, the image's settings, the sandbox tools, the broker,
# the substrate whose isolation the test copies, the microVM's init and contract, the engine and the `hyalos` command that run a job
# end to end in it, or the workspace's build settings.
on:
  pull_request:
    paths:
      - "images/sandbox/**"
      - "crates/sandbox-tools/**"
      - "core/broker/**"
      - "core/types/**"
      - "core/substrate/**"
      - "core/hyalos/**"
      - "core/engine/**"
      - "core/policy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".dockerignore"
      - ".github/workflows/sandbox-image.yml"
      - ".github/scripts/install-gvisor.sh"
      - ".github/scripts/install-firecracker.sh"
      - "crates/vm-init/**"
      - "crates/substrate-contract/**"
  push:
    branches: [main]
    paths:
      - "images/sandbox/**"
      - "crates/sandbox-tools/**"
      - "core/broker/**"
      - "core/types/**"
      - "core/substrate/**"
      - "core/hyalos/**"
      - "core/engine/**"
      - "core/policy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".dockerignore"
      - ".github/workflows/sandbox-image.yml"
      - ".github/scripts/install-gvisor.sh"
      - ".github/scripts/install-firecracker.sh"
      - "crates/vm-init/**"
      - "crates/substrate-contract/**"

permissions:
  contents: read

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  image:
    name: sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Base images are pinned by digest in the Containerfile, harnesses by the lockfile.
      # A job runs on the strongest substrate the host has, so the end-to-end job runs under gVisor.
      - name: Install gVisor
        run: .github/scripts/install-gvisor.sh
      - name: Build the image and its test target
        run: |
          docker build -f images/sandbox/Containerfile --target sandbox -t hyalos-sandbox .
          docker build -f images/sandbox/Containerfile --target test -t hyalos-sandbox:test .
      - name: Each harness and git make no lookup and no call but the broker's
        run: cargo test -p hyalos-sandbox-tools --locked --test image --test egress --test git -- --nocapture
        env:
          HYALOS_REQUIRE_SANDBOX_IMAGE: "1"
      # S3.10 (ADR-0050): hyalos run with Codex in the image, and a dump of the sandbox for credentials.
      - name: A job from the command line pushes, opens a pull request and leaks no credential
        run: cargo test -p hyalos --locked --test run_image -- --nocapture
        env:
          HYALOS_REQUIRE_SANDBOX_IMAGE: "1"
          HYALOS_REQUIRE_GIT: "1"
          HYALOS_REQUIRE_GVISOR: "1"
      # ADR-0058: the image's harnesses in a Firecracker microVM, reaching the broker over vsock.
      - name: Install Firecracker, the guest kernel and the init
        run: .github/scripts/install-firecracker.sh "$RUNNER_TEMP/microvm"
      # The test's readiness check boots a VM from the contract's image before the sandbox image's.
      - name: Pull the substrate contract's image
        run: docker pull ubuntu:24.04
      - name: The image's harnesses reach the broker from a microVM
        run: cargo test -p hyalos-substrate-contract --locked --test microvm -- --nocapture
        env:
          HYALOS_REQUIRE_SANDBOX_IMAGE: "1"
          HYALOS_REQUIRE_MICROVM: "1"
