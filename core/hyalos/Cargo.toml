[package]
name = "hyalos"
description = "The hyalos binary: wires the engine and broker together and holds the command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hyalos-types = { path = "../types" }
hyalos-log = { path = "../log" }
hyalos-policy = { path = "../policy" }
hyalos-substrate = { path = "../substrate" }
hyalos-engine = { path = "../engine" }
hyalos-plugin = { path = "../plugin" }
hyalos-broker = { path = "../broker" }
getrandom = "0.4"
zeroize = "1"
rustix = { version = "1.1.6", features = ["process", "net", "termios"] }
# The GitHub App's JWT is RS256 (ADR-0044). ring is already in the build under rustls; the `rsa`
# crate is not used because of its unfixed timing advisory (RUSTSEC-2023-0071).
ring = "0.17.14"
# Reads the App's PEM private key (PKCS#1 as GitHub generates it, or PKCS#8).
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# The GitHub API's requests and answers are JSON, and so is a run's stored request (ADR-0069).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ctrl-C and SIGTERM during `hyalos run` are taken on a thread of their own, so the run can still end
# the job and revoke its token (ADR-0053). The workspace forbids unsafe code; this wraps sigaction.
signal-hook = { version = "0.3.18", default-features = false, features = ["iterator"] }

[dev-dependencies]
# The fake substrate runs the end-to-end leak test's sandbox (S3.2). Never linked into the binary.
hyalos-substrate-contract = { path = "../../crates/substrate-contract" }
rusqlite = { version = "0.41", features = ["bundled"] }

# Runs on its own main thread, as the binary does, not on a test harness thread (#280). The release
# check runs it built for musl.
[[test]]
name = "main_thread"
harness = false
