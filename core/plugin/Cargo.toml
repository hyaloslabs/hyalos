[package]
name = "hyalos-plugin"
description = "The plugin runtime: the Wasmtime host, install and verification (ADR-0006, ADR-0007, ADR-0086, ADR-0087)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The WASM host (S6.1, ADR-0087). Pinned exactly; no WASI, no default features: a plugin reaches the
# world only through the host imports its capabilities grant.
wasmtime = { version = "=50.0.2", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
hyalos-types = { path = "../types" }
# Error text (ADR-0126). A proc-macro: it writes the Display and Error impls at build time.
thiserror = "2"
# The digest that binds an install to its files (S6.2, ADR-0089).
sha2 = "0.11"
# A plugin index is JSON (S7.9, ADR-0090).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one Sigstore verifier (S7.12, ADR-0007, ADR-0093), at the version spike #73 tested. No network
# features: no TUF client, no Rekor or TSA client. Its only crypto backend is aws-lc-rs.
sigstore-verify = { version = "=0.15.1", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
wat = "=1.261.0"
# Flipping a bit of a bundle's signature in the vectors test.
base64 = "0.23"
hyalos-sigstore-testkit = { path = "../../crates/sigstore-testkit" }
