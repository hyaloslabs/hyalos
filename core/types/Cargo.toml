[package]
name = "hyalos-types"
description = "Shared domain types: ids, provenance, verdicts, manifests, event envelopes, channel messages. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519 for the job manifest (ADR-0031). The `rand_core` feature that could generate a key is off.
ed25519-dalek = "3"
