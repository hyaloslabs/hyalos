[package]
name = "hyalos-broker"
description = "Manifest enforcement, model protocols, forge and egress proxy, and parsing of untrusted input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hyalos-types = { path = "../types" }
# Model requests and responses are JSON (ADR-0016, ADR-0037); the broker reads and rewrites them.
serde_json = "1"
# TLS to model providers on the internet (ADR-0039): rustls on ring, TLS 1.3 and 1.2, no logging.
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
# The Mozilla root set, compiled in, so the roots are the same on every host (ADR-0039).
webpki-roots = "1.0.11"

[dev-dependencies]
# Hand-built signatures in tests, to show what the broker refuses.
ed25519-dalek = "3"
