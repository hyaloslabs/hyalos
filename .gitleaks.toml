# gitleaks (https://github.com/gitleaks/gitleaks): its default rules, minus three keys made for the
# tests alone. Each is no real credential:
# - github-app-test.pem is no App's key (ADR-0044);
# - the two leaf.key files belong to a localhost certificate issued by "Hyalos test CA (not trusted
#   anywhere)".
# Add a path here only for a key made for a test, with the reason; never for a real one.
[extend]
useDefault = true

[allowlist]
description = "keys made for the tests alone"
paths = [
  '''^core/hyalos/tests/fixtures/github-app-test\.pem$''',
  '''^core/broker/tests/fixtures/tls/leaf\.key$''',
  '''^crates/sandbox-tools/tests/fixtures/tls/leaf\.key$''',
]
